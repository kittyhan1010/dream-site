name: 키워드 발굴·사이트 배포

# 원고 작성은 Claude 예약 작업이 매일 아침 하고, 결과를 main에 push합니다.
# 이 워크플로는 API 키 없이 돌아갑니다.
#  - 매일 자정 무렵(KST 0시 17분): 자동완성 키워드 발굴 → 대기열 커밋 → 배포
#    (Claude 원고 작성은 새벽 1시 무렵, 오전 6시 무렵 두 번)
#  - main에 push될 때(새 원고 포함): 빌드 → 배포

on:
  schedule:
    - cron: "17 15 * * *"  # 매일 한국시간 0시 17분 (UTC 15시 17분)
  workflow_dispatch:       # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 자동완성 키워드 발굴
        if: github.event_name != 'push'
        run: python scripts/expand_keywords.py

      - name: 키워드 대기열 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "dream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "새 키워드 없음"
          else
            git commit -m "키워드 대기열 갱신 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: 사이트 빌드
        run: python scripts/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
