name: 매일 꿈해몽 페이지 생성·배포

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 오전 6시 (UTC 21시)
  workflow_dispatch:       # Actions 탭에서 수동 실행
    inputs:
      pages:
        description: "오늘 만들 페이지 수 (비우면 config.json 값)"
        required: false
        default: ""
  push:
    branches: [main]       # 코드·디자인 수정 시 생성 없이 다시 배포만

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 키워드 확장 + 페이지 생성
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily.py --pages "${{ github.event.inputs.pages }}"

      - name: 새 페이지를 저장소에 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "dream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data
          if git diff --cached --quiet; then
            echo "새로 만든 페이지 없음"
          else
            git commit -m "꿈해몽 페이지 추가 $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - name: 사이트 빌드
        run: python scripts/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
